                        <button value="A14">A14</button>
                        <button value="A15">A15</button>

                </div>

                <div class="block-container">

                        <button value="B3">B3</button>
                        <button value="B4">B4</button>
                        <button value="B5">B5</button>
                        <button value="B6">B6</button>
                        <button value="B7">B7</button>
                        <button value="B8">B8</button>
                        <button value="B9">B9</button>
                        <button value="B10">B10</button>
                        <button value="B11">B11</button>
                        <button value="B12">B12</button>
                        <button value="B13">B13</button>
                        <button value="B14">B14</button>
                        <button value="B15">B15</button>
                        <button value="B16">B16</button>
                        <button value="B17">B17</button>
                        <button value="B18">B18</button>
                        <button value="B19">B19</button>
                        <button value="B20">B20</button>
                    </div>
                </div>

                <div class="block-container">
                    <label class="block-label">C-Block</label>
                    <div class="c-block">

            </div>
        </main>
    </div>

    <script>
        const userName = document.getElementById('userName');
        const userEmail = document.getElementById('userEmail');
        const userAvatar = document.getElementById('userAvatar');
        const selectionStatus = document.getElementById('selectionStatus');
        const reserveButton = document.getElementById('reserveButton');

        async function fetchCurrentUser() {
            const apiUrls = [
                'http://172.30.3.21/g_park/current-user.php',
                'http://localhost/g_park/current-user.php'
            ];

            for (let index = 0; index < apiUrls.length; index += 1) {
                try {
                    const response = await fetch(apiUrls[index], {
                        credentials: 'include'
                    });

                    if (response.ok) {
                        return (await response.json()).user;
                    }

                    if (response.status === 401) {
                        break;
                    }
                } catch (error) {
                    if (index === apiUrls.length - 1) {
                        throw error;
                    }
                }
            }

            const storedUser = localStorage.getItem('gparkUser');
            return storedUser ? JSON.parse(storedUser) : null;
        }

        fetchCurrentUser().then((user) => {
            if (!user) {
                userName.textContent = 'Session expired';
                userEmail.textContent = 'Please log in again.';
                reserveButton.disabled = true;
                return;
            }

            userName.textContent = user.name;
            userEmail.textContent = user.email;
            userAvatar.textContent = user.name.trim().charAt(0).toUpperCase();
        }).catch(() => {
            userName.textContent = 'Unable to load account';
            userEmail.textContent = 'Please refresh the page.';
        });

        const selectedSlots = document.querySelectorAll('.block-container button');
        selectedSlots.forEach((button) => {
            button.addEventListener('click', () => {
                const isSelected = button.classList.contains('selected');
                button.classList.toggle('selected', !isSelected);
                const selectedCount = document.querySelectorAll('.block-container button.selected').length;
                selectionStatus.textContent = selectedCount === 0
                    ? 'No slot selected'
                    : `${selectedCount} slot${selectedCount === 1 ? '' : 's'} selected`;
                reserveButton.disabled = selectedCount === 0;
            });
        });

        reserveButton.addEventListener('click', () => {
            selectionStatus.textContent = 'Select a slot to continue';
        });
    </script>
</body>
</html>
