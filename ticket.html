<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Booking Confirmed | GPark</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #17221d;
			--muted: #66736b;
			--paper: #f7f8f3;
			--card: #ffffff;
			--accent: #e4663f;
			--line: #dce3dc;
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: radial-gradient(circle at top right, #d9e8d7, transparent 42%), var(--paper);
			color: var(--ink);
			font-family: Georgia, 'Times New Roman', serif;
		}
		main { width: min(100%, 560px); }
		.ticket {
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--card);
			box-shadow: 0 20px 60px rgba(23, 34, 29, 0.12);
		}
		.ticket-header { padding: 32px; background: var(--ink); color: white; }
		.eyebrow { color: #f4ad8e; font: 700 12px/1.2 Arial, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
		h1 { margin: 12px 0 0; font-size: clamp(32px, 8vw, 52px); line-height: 0.95; font-weight: 400; }
		.ticket-body { padding: 28px 32px 32px; }
		.booking-id { margin: 0 0 24px; color: var(--muted); font: 700 13px/1.4 Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
		.details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; margin: 0; background: var(--line); border: 1px solid var(--line); }
		.detail { min-width: 0; padding: 16px; background: var(--card); }
		dt { color: var(--muted); font: 700 11px/1.2 Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
		dd { margin: 7px 0 0; overflow-wrap: anywhere; font-size: 19px; }
		.actions { display: flex; gap: 12px; margin-top: 28px; }
		a { display: inline-block; padding: 12px 16px; border-radius: 4px; font: 700 13px/1 Arial, sans-serif; text-decoration: none; }
		.primary { background: var(--accent); color: white; }
		.secondary { border: 1px solid var(--line); color: var(--ink); }
		.empty { text-align: center; }
		@media (max-width: 480px) { .ticket-header, .ticket-body { padding: 24px; } .details { grid-template-columns: 1fr; } }
	</style>
</head>
<body>
	<main>
		<section class="ticket" id="ticketContent" hidden>
			<header class="ticket-header">
				<span class="eyebrow">GPark reservation</span>
				<h1>Booking confirmed</h1>
			</header>
			<div class="ticket-body">
				<p class="booking-id">Booking ID: <strong id="bookingId"></strong></p>
				<dl class="details">
					<div class="detail"><dt>Parking slot</dt><dd id="slot"></dd></div>
					<div class="detail"><dt>Vehicle number</dt><dd id="vehicleNumber"></dd></div>
					<div class="detail"><dt>Vehicle type</dt><dd id="vehicleType"></dd></div>
					<div class="detail"><dt>Vehicle model</dt><dd id="vehicleModel"></dd></div>
					<div class="detail"><dt>Duration</dt><dd id="duration"></dd></div>
					<div class="detail"><dt>Booked by</dt><dd id="bookedBy"></dd></div>
				</dl>
				<div class="actions">
					<a class="primary" href="book.html">Book another slot</a>
				</div>
			</div>
		</section>
		<section class="ticket empty" id="emptyState" hidden>
			<div class="ticket-body">
				<h1>Booking not found</h1>
				<p>This ticket is no longer available in this browser.</p>
				<div class="actions"><a class="primary" href="book.html">Return to booking</a></div>
			</div>
		</section>
	</main>
	<script>
		const savedBooking = JSON.parse(localStorage.getItem('gparkLatestBooking') || 'null');
		const query = new URLSearchParams(window.location.search);
		const queryBooking = query.has('booking_id') ? {
			booking_id: query.get('booking_id'),
			slot: query.get('slot'),
			vehicle_number: query.get('vehicle_number'),
			vehicle_type: query.get('vehicle_type'),
			vehicle_model: query.get('vehicle_model'),
			duration: query.get('duration'),
			booked_by: query.get('booked_by')
		} : null;
		const booking = queryBooking || savedBooking;
		const ticketContent = document.getElementById('ticketContent');
		const emptyState = document.getElementById('emptyState');

		if (!booking) {
			emptyState.hidden = false;
		} else {
			const fields = {
				bookingId: booking.booking_id,
				slot: booking.slot,
				vehicleNumber: booking.vehicle_number,
				vehicleType: Number(booking.vehicle_type) === 0 ? 'Two-wheeler' : 'Four-wheeler',
				vehicleModel: booking.vehicle_model,
				duration: `${booking.duration} hour${Number(booking.duration) === 1 ? '' : 's'}`,
				bookedBy: booking.booked_by
			};

			Object.entries(fields).forEach(([id, value]) => {
				document.getElementById(id).textContent = value || '-';
			});
			ticketContent.hidden = false;
		}
	</script>
</body>
</html>
