<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Booking Confirmed | GPark</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap');

		:root {
			color-scheme: light;
			--ink: #111827;
			--muted: #5b6477;
			--paper: #f4f7ff;
			--card: #ffffff;
			--primary: #6758f3;
			--primary-dark: #4f3ae4;
			--success: #17b26a;
			--line: rgba(17, 24, 39, 0.08);
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: linear-gradient(135deg, #f3f6ff 0%, #eef2ff 30%, #f9fafb 100%);
			color: var(--ink);
			font-family: "DM Sans", sans-serif;
		}
		main { width: min(100%, 560px); }
		.ticket {
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: 28px;
			background: rgba(255, 255, 255, 0.88);
			box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
		}
		.ticket-header { padding: 32px; background: linear-gradient(135deg, #181d38, #11152a); color: white; }
		.eyebrow { display: inline-block; padding: 8px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); color: #c9c3ff; font: 700 12px/1.2 "DM Sans", sans-serif; letter-spacing: 0.1em; text-transform: uppercase; }
		h1 { margin: 16px 0 0; font-size: clamp(28px, 6vw, 40px); line-height: 1.05; font-weight: 800; letter-spacing: -0.03em; }
		.ticket-body { padding: 28px 32px 32px; }
		.booking-id { margin: 0 0 24px; color: var(--muted); font: 700 13px/1.4 "DM Sans", sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
		.booking-id strong { color: var(--ink); }
		.details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; margin: 0; background: var(--line); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
		.detail { min-width: 0; padding: 16px; background: var(--card); }
		dt { color: var(--muted); font: 700 11px/1.2 "DM Sans", sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
		dd { margin: 7px 0 0; overflow-wrap: anywhere; font-size: 18px; font-weight: 700; color: var(--ink); }
		.actions { display: flex; gap: 12px; margin-top: 28px; }
		a, button { display: inline-block; padding: 14px 20px; border-radius: 14px; font: 700 13px/1 "DM Sans", sans-serif; text-decoration: none; transition: transform 0.2s ease, box-shadow 0.2s ease; }
	button { border: 1px solid var(--line); color: var(--ink); background: #fff; cursor: pointer; }
		.primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; box-shadow: 0 16px 28px rgba(103, 88, 243, 0.28); }
		.primary:hover, button:hover { transform: translateY(-2px); }
		.secondary { border: 1px solid var(--line); color: var(--ink); background: #fff; }
		.empty { text-align: center; }
		@media print {
			body { padding: 0; background: #fff; }
			.ticket { border: 0; box-shadow: none; }
			.actions { display: none; }
		}
		@media (max-width: 480px) { .ticket-header, .ticket-body { padding: 24px; } .details { grid-template-columns: 1fr; } }
	</style>
</head>
<body>
	<main>
		<section class="ticket" id="ticketContent" hidden>
			<header class="ticket-header">
				<span class="eyebrow">GPark reservation</span>
				<h1>Booking confirmed</h1>
			</header>
			<div class="ticket-body">
				<p class="booking-id">Booking ID: <strong id="bookingId"></strong></p>
				<dl class="details">
					<div class="detail"><dt>Parking slot</dt><dd id="slot"></dd></div>
					<div class="detail"><dt>Vehicle number</dt><dd id="vehicleNumber"></dd></div>
					<div class="detail"><dt>Vehicle type</dt><dd id="vehicleType"></dd></div>
					<div class="detail"><dt>Vehicle model</dt><dd id="vehicleModel"></dd></div>
					<div class="detail"><dt>Duration</dt><dd id="duration"></dd></div>
					<div class="detail"><dt>Booked by</dt><dd id="bookedBy"></dd></div>
				</dl>
				<div class="actions">
					<a class="primary" href="book.html">Book another slot</a>
					<button type="button" id="downloadTicket">Download ticket</button>
				</div>
			</div>
		</section>
		<section class="ticket empty" id="emptyState" hidden>
			<div class="ticket-body">
				<h1>Booking not found</h1>
				<p>This ticket is no longer available in this browser.</p>
				<div class="actions"><a class="primary" href="book.html">Return to booking</a></div>
			</div>
		</section>
	</main>
	<script>
		const savedBooking = JSON.parse(localStorage.getItem('gparkLatestBooking') || 'null');
		const query = new URLSearchParams(window.location.search);
		const queryBooking = query.has('booking_id') ? {
			booking_id: query.get('booking_id'),
			slot: query.get('slot'),
			vehicle_number: query.get('vehicle_number'),
			vehicle_type: query.get('vehicle_type'),
			vehicle_model: query.get('vehicle_model'),
			duration: query.get('duration'),
			booked_by: query.get('booked_by')
		} : null;
		const booking = queryBooking || savedBooking;
		const ticketContent = document.getElementById('ticketContent');
		const emptyState = document.getElementById('emptyState');
		const downloadTicket = document.getElementById('downloadTicket');

		downloadTicket.addEventListener('click', () => window.print());

		if (!booking) {
			emptyState.hidden = false;
		} else {
			const fields = {
				bookingId: booking.booking_id,
				slot: booking.slot,
				vehicleNumber: booking.vehicle_number,
				vehicleType: Number(booking.vehicle_type) === 0 ? 'Two-wheeler' : 'Four-wheeler',
				vehicleModel: booking.vehicle_model,
				duration: `${booking.duration} hour${Number(booking.duration) === 1 ? '' : 's'}`,
				bookedBy: booking.booked_by
			};

			Object.entries(fields).forEach(([id, value]) => {
				document.getElementById(id).textContent = value || '-';
			});
			ticketContent.hidden = false;
		}
	</script>
</body>
</html>
