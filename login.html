<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | GPark</title>
    <link rel="icon" href="images/image.png">
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-panel brand-panel">
            <div class="brand-mark">GPark</div>
            <h1>Welcome back.<br>Continue your trip.</h1>
            <p>
                Access your reservations, track parking availability, and manage your bookings effortlessly.
            </p>

            <ul class="feature-list">
                <li>Fast booking access</li>
                <li>Saved preferences</li>
                <li>Secure account protection</li>
            </ul>
        </section>

        <section class="auth-panel form-panel">
            <div class="form-header">
                <span class="eyebrow">Member login</span>
                <h2>Sign in</h2>
                <p>Use your account to continue.</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="email" id="username" name="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="login-password">Password</label>
                    <div class="password-field">
                        <input type="password" id="login-password" name="password" placeholder="Enter your password" aria-describedby="password-error">
                        <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false" hidden>
                            <span class="eye-icon" aria-hidden="true"></span>
                        </button>
                    </div>
                    <p class="field-error" id="password-error" role="alert" aria-live="polite"></p>
                </div>

                <button type="submit">Login</button>

                <div id="loginMessage" class="login-snackbar" role="alert" aria-live="polite" aria-hidden="true"></div>

                <p class="switch-text">
                    Don’t have an account?
                    <a href="SignUp.html">Create one</a>
                </p>
            </form>
        </section>
    </main>

    <script>
        const loginForm = document.getElementById('loginForm');
        const passwordInput = document.querySelector('#login-password');
        const passwordError = document.querySelector('#password-error');
        const loginMessage = document.getElementById('loginMessage');

        document.querySelectorAll('.password-field').forEach((field) => {
            const input = field.querySelector('input');
            const toggle = field.querySelector('.password-toggle');

            const updateToggleVisibility = () => {
                const hasPassword = input.value.length > 0;
                toggle.hidden = !hasPassword;

                if (!hasPassword && input.type === 'text') {
                    input.type = 'password';
                    toggle.setAttribute('aria-label', 'Show password');
                    toggle.setAttribute('aria-pressed', 'false');
                }
            };

            input.addEventListener('input', updateToggleVisibility);
            updateToggleVisibility();

            toggle.addEventListener('click', () => {
                const isVisible = input.type === 'text';
                input.type = isVisible ? 'password' : 'text';
                toggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
                toggle.setAttribute('aria-pressed', String(!isVisible));
            });
        });

        function validatePassword() {
            const password = passwordInput.value;
            let message = '';

            if (password.length < 5) {
                message = 'Use at least 5 characters.';
            } else if (!/[^\p{L}\p{N}\s]/u.test(password)) {
                message = 'Include at least 1 special character.';
            }

            passwordError.textContent = message;
            passwordError.hidden = !message;
            passwordInput.classList.toggle('input-error', Boolean(message));

            return !message;
        }

        function showLoginError(message) {
            loginMessage.textContent = message;
            loginMessage.classList.remove('is-success');
            loginMessage.classList.add('is-visible');
            loginMessage.setAttribute('aria-hidden', 'false');
        }

        function showLoginSuccess(message) {
            loginMessage.textContent = message;
            loginMessage.classList.add('is-success', 'is-visible');
            loginMessage.setAttribute('aria-hidden', 'false');
        }

        async function fetchLoginApi(options) {
            const apiUrls = [
                'http://172.30.3.21/g_park/login.php',
                'http://localhost/g_park/login.php'
            ];

            for (let index = 0; index < apiUrls.length; index += 1) {
                try {
                    return await fetch(apiUrls[index], options);
                } catch (error) {
                    if (index === apiUrls.length - 1) {
                        throw error;
                    }
                }
            }
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            // Perform client-side validation first
            if (!validatePassword()) {
                passwordInput.focus();
                return;
            }

            // Reset snackbar state
            loginMessage.textContent = '';
            loginMessage.classList.remove('is-visible');
            loginMessage.setAttribute('aria-hidden', 'true');

            const formData = new FormData(loginForm);

            try {
                const response = await fetchLoginApi({
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: formData.get('email'),
                        password: formData.get('password')
                    })
                });
                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || 'Login failed.');
                }

                showLoginSuccess('Login successful. Opening your bookings...');
                setTimeout(() => {
                    window.location.href = 'book.html';
                }, 2000);
            } catch (error) {
                showLoginError(error.message || 'Unable to connect to the server.');
            }
        });
    </script>
</body>
</html>
